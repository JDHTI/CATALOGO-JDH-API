# ─────────────────────────────────────────────────────────────────────────
# Catálogo JDH — stack de producción completo (servidor tienda.jdh.local)
#
#   https://tienda.jdh.local/            → caddy → ui:3000   (Next.js, BFF + Better Auth)
#   https://tienda.jdh.local/api/v1/*    → caddy → api:8080  (NestJS, lo llama el navegador)
#   https://tienda.jdh.local/media/*     → caddy → storage:9000/<bucket>/* (solo lectura)
#
# Un solo origen (sin CORS ni segundo DNS). Postgres, Redis y el S3 de escritura
# NO se publican: solo Caddy escucha en 80/443.
#
# Requiere los dos repos clonados lado a lado:
#   ~/apps/CATALOGO-JDH-API   (este repo: dueño del stack)
#   ~/apps/CATALOGO-JDH-UI
# (UI_CONTEXT cambia la ruta de la UI: útil para probar en otra máquina.)
#
# Uso (desde ~/apps/CATALOGO-JDH-API):  deploy/scripts/deploy.sh [servicio...]
# Equivale a:
#   docker compose -f deploy/compose.prod.yaml --env-file deploy/.env up -d --build
#
# Cada contenedor recibe SOLO las variables que necesita (mapeadas aquí desde
# deploy/.env), nunca el .env completo.
# ─────────────────────────────────────────────────────────────────────────
name: tienda-jdh

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

x-api-database-url: &api-database-url postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
x-auth-database-url: &auth-database-url postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AUTH_DB_NAME:-jdh_auth}

services:
  # ── Reverse proxy + TLS (CA interna de Caddy) ──────────────────────────
  caddy:
    image: caddy:2.10-alpine
    container_name: tienda-caddy
    restart: unless-stopped
    ports:
      # Configurables solo para máquinas donde 80/443 ya están ocupados (p. ej.
      # pruebas en Windows). En el servidor se dejan los valores por defecto.
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    environment:
      TIENDA_HOST: ${TIENDA_HOST}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # CA raíz propia (deploy/scripts/init-ca.sh). No versionada.
      - ./caddy/ca:/etc/caddy/ca:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        # La UI resuelve su propio dominio público hacia Caddy sin salir de la
        # red de Docker ni depender del DNS corporativo (SSR + /_next/image).
        aliases:
          - ${TIENDA_HOST}
    logging: *logging

  # ── Frontend Next.js (catálogo + servidor de autenticación) ────────────
  ui:
    build:
      context: ${UI_CONTEXT:-../../CATALOGO-JDH-UI}
      target: runtime
      args:
        # NEXT_PUBLIC_* se incrustan en el bundle: cambiarlas exige rebuild.
        # Relativa: el navegador la completa con el origen por el que entró
        # (IP, nombre .local o público). El SSR usa BACKEND_API_URL.
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_SITE_URL: https://${TIENDA_HOST}
        NEXT_PUBLIC_ASSETS_CDN_URL: https://${TIENDA_HOST}/media
        # El bucket vive en un host de la LAN (alias de Caddy → IP privada de
        # Docker): Next 16 bloquea por defecto optimizar imágenes de IPs
        # locales (SSRF). Aquí es el comportamiento correcto, no un riesgo.
        ALLOW_LOCAL_IMAGE_HOSTS: '1'
    image: tienda-jdh-ui
    container_name: tienda-ui
    restart: unless-stopped
    environment:
      BETTER_AUTH_URL: https://${TIENDA_HOST}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      DATABASE_URL: *auth-database-url
      AUTH_MICROSOFT_ENTRA_ID_ID: ${AUTH_MICROSOFT_ENTRA_ID_ID}
      AUTH_MICROSOFT_ENTRA_ID_SECRET: ${AUTH_MICROSOFT_ENTRA_ID_SECRET}
      AUTH_MICROSOFT_ENTRA_ID_TENANT_ID: ${AUTH_MICROSOFT_ENTRA_ID_TENANT_ID}
      # Servidor → API por la red interna (favoritos, listas de pedido).
      BACKEND_API_URL: http://api:8080/api/v1
      # Confía en la CA raíz interna para el fetch server-side a
      # https://${TIENDA_HOST} (catálogo SSR e imágenes).
      NODE_EXTRA_CA_CERTS: /etc/ssl/jdh/root.crt
    volumes:
      - ./caddy/ca/root.crt:/etc/ssl/jdh/root.crt:ro
    depends_on:
      caddy:
        condition: service_started
      ui-auth-migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    logging: *logging

  # One-shot: tablas de Better Auth (user/session/account/verification/
  # rateLimit/jwks) en la base jdh_auth. Idempotente.
  ui-auth-migrate:
    build:
      context: ${UI_CONTEXT:-../../CATALOGO-JDH-UI}
      target: auth-migrate
    image: tienda-jdh-ui-auth-migrate
    container_name: tienda-ui-auth-migrate
    restart: 'no'
    environment:
      DATABASE_URL: *auth-database-url
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  # ── API NestJS ─────────────────────────────────────────────────────────
  api:
    build:
      context: ..
      target: runtime
    image: tienda-jdh-api
    container_name: tienda-api
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    # Las migraciones las aplica `api-migrate` (one-shot); se salta la parte
    # de `docker/entrypoint.sh` que las repite.
    entrypoint: ['node', 'dist/src/main']
    environment:
      NODE_ENV: production
      PORT: '8080'
      API_PREFIX: api
      API_VERSION: v1
      # Solo Caddy (red de compose) puede fijar X-Forwarded-For: sin esto el
      # rate limit vería la IP de Caddy para todo el mundo.
      TRUST_PROXY: ${DOCKER_SUBNET:-172.29.60.0/24}
      DATABASE_URL: *api-database-url
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      S3_ENDPOINT: http://storage:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: 'true'
      # URL pública de los objetos (Caddy /media → bucket).
      S3_PUBLIC_URL: https://${TIENDA_HOST}/media
      # JWKS de la UI por la red interna (sin TLS ni CA). El `iss`/`aud` del
      # token son identificadores lógicos y no dependen de esta URL.
      AUTH_JWKS_URL: http://ui:3000/api/auth/jwks
      AUTH_JWT_ISSUER: jdh-catalogo-ui
      AUTH_JWT_AUDIENCE: jdh-catalogo-api
      # El DWH solo es alcanzable desde la red interna y sus credenciales se
      # añaden cuando el equipo de datos las entregue; sin DWH_HOST queda
      # deshabilitado y la API sirve igual.
      SYNC_PRODUCTS_ENABLED: ${SYNC_PRODUCTS_ENABLED:-false}
      SYNC_PRODUCTS_CRON: ${SYNC_PRODUCTS_CRON:-0 2 * * *}
      DWH_HOST: ${DWH_HOST:-}
      DWH_PORT: ${DWH_PORT:-5432}
      DWH_DATABASE: ${DWH_DATABASE:-}
      DWH_USER: ${DWH_USER:-}
      DWH_PASSWORD: ${DWH_PASSWORD:-}
      DWH_SCHEMA: ${DWH_SCHEMA:-public}
      DWH_SSL: ${DWH_SSL:-false}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/api/v1/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    logging: *logging

  # One-shot: `prisma migrate deploy` con la misma imagen del API.
  api-migrate:
    build:
      context: ..
      target: runtime
    image: tienda-jdh-api
    container_name: tienda-api-migrate
    restart: 'no'
    entrypoint: ['node_modules/.bin/prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: *api-database-url
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  # ── Datos ──────────────────────────────────────────────────────────────
  # Una sola instancia de Postgres con dos bases: ${POSTGRES_DB} (Prisma,
  # catálogo) y jdh_auth (Better Auth). La segunda la crea
  # docker/postgres/init/01-crear-base-auth.sh solo con el volumen vacío.
  postgres:
    image: postgres:17-alpine
    container_name: tienda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Bogota
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  redis:
    image: redis:7-alpine
    container_name: tienda-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lfu --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', '--no-auth-warning', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  # Almacenamiento S3-compatible: imágenes de producto, logos y banners.
  # RustFS (la imagen de MinIO ya no se publica en Docker Hub). La API escribe
  # por la red interna; el navegador solo LEE, vía Caddy /media (bucket con
  # política de descarga anónima, ver storage-init).
  storage:
    image: rustfs/rustfs:1.0.1
    container_name: tienda-storage
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ENABLE: 'false'
    volumes:
      - storage_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 9000 || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  # One-shot: crea el bucket y lo deja de lectura pública. Idempotente.
  # Solo curl firmando con SigV4: sin cliente S3 propio que pueda desaparecer
  # de un registro (como pasó con las imágenes de MinIO).
  storage-init:
    image: curlimages/curl:8.11.1
    container_name: tienda-storage-init
    restart: 'no'
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        s3() { curl -sS --aws-sigv4 "aws:amz:us-east-1:s3" --user "$$S3_ACCESS_KEY_ID:$$S3_SECRET_ACCESS_KEY" "$$@"; }
        url="http://storage:9000/$$S3_BUCKET"
        [ "$$(s3 -o /dev/null -w '%{http_code}' --head "$$url")" = 200 ] || s3 -f -o /dev/null -X PUT "$$url"
        policy=$$(printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::%s/*"]}]}' "$$S3_BUCKET")
        s3 -f -o /dev/null -X PUT -H 'Content-Type: application/json' --data "$$policy" "$$url?policy"
        echo "Bucket $$S3_BUCKET listo (lectura publica de objetos)"
    depends_on:
      storage:
        condition: service_healthy
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  pg_data:
  redis_data:
  storage_data:

# Subred fija: TRUST_PROXY del API la necesita (CIDR de la red de compose).
# Si choca con otra red del servidor, cambiar DOCKER_SUBNET en deploy/.env.
networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.29.60.0/24}
