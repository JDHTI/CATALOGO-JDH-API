name: jdh-catalogo

services:
  postgres:
    image: postgres:17-alpine
    container_name: jdh-catalogo-postgres
    restart: unless-stopped
    env_file:
      - ./docker/env/postgres.env
    ports:
      - '${POSTGRES_HOST_PORT:-5435}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jdh-catalogo

  redis:
    image: redis:7-alpine
    container_name: jdh-catalogo-redis
    restart: unless-stopped
    env_file:
      - ./docker/env/redis.env
    command:
      [
        'sh',
        '-c',
        'redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes',
      ]
    ports:
      - '${REDIS_HOST_PORT:-6380}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jdh-catalogo

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: jdh-catalogo-redis-commander
    restart: unless-stopped
    env_file:
      - ./docker/env/redis-commander.env
    ports:
      - '${REDIS_COMMANDER_HOST_PORT:-8081}:8081'
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - jdh-catalogo

  minio:
    image: minio/minio:latest
    container_name: jdh-catalogo-minio
    restart: unless-stopped
    env_file:
      - ./docker/env/minio.env
    command: ['server', '/data', '--console-address', ':9001']
    ports:
      - '${MINIO_API_HOST_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_HOST_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jdh-catalogo

  # Crea el bucket del catálogo y lo deja listo para uso local.
  minio-init:
    image: minio/mc:latest
    container_name: jdh-catalogo-minio-init
    env_file:
      - ./docker/env/minio.env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\";
      mc mb --ignore-existing local/\"$$MINIO_DEFAULT_BUCKET\";
      mc anonymous set download local/\"$$MINIO_DEFAULT_BUCKET\";
      exit 0;
      "
    networks:
      - jdh-catalogo

  # API de producción — HTTP en 3000, sin `sharp` (ver Dockerfile): la
  # ingesta de imágenes (`pnpm images:ingest`) es solo local, nunca corre acá.
  api:
    build: .
    container_name: jdh-catalogo-api
    restart: unless-stopped
    env_file:
      - ./.env
      - ./docker/env/postgres.env
    environment:
      # `.env` trae DATABASE_URL/REDIS_HOST/S3_ENDPOINT apuntando a `localhost`
      # (uso desde el host). Acá se limpian/sobreescriben al nombre del
      # servicio dentro de la red de compose: DATABASE_URL vacía hace que el
      # entrypoint la arme con POSTGRES_* (env_file de arriba) + host `postgres`.
      DATABASE_URL: ''
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      S3_ENDPOINT: http://minio:9000
    ports:
      # El puerto del contenedor es el mismo PORT que trae `.env` (8080 por
      # convención de este repo), no un 3000 fijo.
      - '${API_HOST_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - jdh-catalogo

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  jdh-catalogo:
    driver: bridge
