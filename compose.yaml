name: jdh-catalogo

services:
  postgres:
    image: postgres:17-alpine
    container_name: jdh-catalogo-postgres
    restart: unless-stopped
    env_file:
      - ./docker/env/postgres.env
    ports:
      - '${POSTGRES_HOST_PORT:-5435}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Scripts de primer arranque. Hoy solo crean `jdh_auth`, la base de
      # sesiones de la UI (ver el propio script y docs/infrastructure.md).
      # Postgres los corre unicamente con el volumen de datos vacio.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jdh-catalogo

  redis:
    image: redis:7-alpine
    container_name: jdh-catalogo-redis
    restart: unless-stopped
    env_file:
      - ./docker/env/redis.env
    command:
      [
        'sh',
        '-c',
        'redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lfu',
      ]
    ports:
      - '${REDIS_HOST_PORT:-6380}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jdh-catalogo

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: jdh-catalogo-redis-commander
    restart: unless-stopped
    env_file:
      - ./docker/env/redis-commander.env
    ports:
      - '${REDIS_COMMANDER_HOST_PORT:-8081}:8081'
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - jdh-catalogo

  minio:
    image: minio/minio:latest
    container_name: jdh-catalogo-minio
    restart: unless-stopped
    env_file:
      - ./docker/env/minio.env
    command: ['server', '/data', '--console-address', ':9001']
    ports:
      - '${MINIO_API_HOST_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_HOST_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jdh-catalogo

  # Crea el bucket del catálogo y lo deja listo para uso local.
  minio-init:
    image: minio/mc:latest
    container_name: jdh-catalogo-minio-init
    env_file:
      - ./docker/env/minio.env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\";
      mc mb --ignore-existing local/\"$$MINIO_DEFAULT_BUCKET\";
      mc anonymous set download local/\"$$MINIO_DEFAULT_BUCKET\";
      exit 0;
      "
    networks:
      - jdh-catalogo

  # API de producción — HTTP en 3000, sin `sharp` (ver Dockerfile): la
  # ingesta de imágenes (`pnpm images:ingest`) es solo local, nunca corre acá.
  api:
    build: .
    container_name: jdh-catalogo-api
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    env_file:
      - ./.env
      - ./docker/env/postgres.env
    environment:
      NODE_ENV: production
      PORT: '8080'
      SYNC_PRODUCTS_ENABLED: 'false'
      # `.env` trae DATABASE_URL/REDIS_HOST/S3_ENDPOINT apuntando a `localhost`
      # (uso desde el host). Acá se limpian/sobreescriben al nombre del
      # servicio dentro de la red de compose: DATABASE_URL vacía hace que el
      # entrypoint la arme con POSTGRES_* (env_file de arriba) + host `postgres`.
      DATABASE_URL: ''
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      S3_ENDPOINT: http://minio:9000
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/' + (process.env.API_PREFIX || 'api') + '/v' + (process.env.API_VERSION || 'v1').replace(/^v/, '') + '/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    # El JWKS de la UI lo sirve un proceso del HOST, no un servicio de compose:
    # `AUTH_JWKS_URL` del `.env` debe apuntar a `host.docker.internal`, no a
    # `localhost` (que aquí dentro es el propio contenedor). Docker Desktop ya
    # resuelve ese nombre; esta línea lo hace funcionar también en Linux.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      # El puerto del contenedor es el mismo PORT que trae `.env` (8080 por
      # convención de este repo), no un 3000 fijo.
      - '${API_HOST_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - jdh-catalogo

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  jdh-catalogo:
    driver: bridge
